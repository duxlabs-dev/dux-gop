name: Claude Review

# Reviews a PR by a member of an allowed team when it is opened or pushed to, or when anyone on the team comments `/claude review`.
# One review per PR at a time: a newer trigger cancels the running one. Review only, no edits or pushes.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token), CLAUDE_REVIEW_ORG_READ_TOKEN (PAT, org Members: read)

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/claude review'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      allowed: ${{ steps.team.outputs.allowed }}
      pr: ${{ github.event.pull_request.number || github.event.issue.number }}
      actor: ${{ github.event.pull_request.user.login || github.event.comment.user.login }}
      request: ${{ github.event.comment.body || 'Automatic review of an opened or updated pull request.' }}
    steps:
      - name: Check team membership
        id: team
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_REVIEW_ORG_READ_TOKEN }}
          ORG: ${{ github.repository_owner }}
          USER: ${{ github.event.pull_request.user.login || github.event.comment.user.login }}
          TEAMS: dms-collaborators owners
        run: |
          allowed=false
          for team in $TEAMS; do
            state=$(gh api "orgs/$ORG/teams/$team/memberships/$USER" --jq .state 2>/dev/null || true)
            [ "$state" = active ] && allowed=true && break
          done
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: React
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOWED: ${{ steps.team.outputs.allowed }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          [ "$ALLOWED" = true ] && content=eyes || content=-1
          gh api -X POST "repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions" -f "content=$content"

  review:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ needs.gate.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Announce start
        id: start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api -X POST "repos/${{ github.repository }}/issues/${{ needs.gate.outputs.pr }}/comments" \
            -f body="Claude review in progress: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .id)
          echo "comment=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ needs.gate.outputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          CLAUDE_CODE_EFFORT_LEVEL: high
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ needs.gate.outputs.pr }} in ${{ github.repository }}, requested by @${{ needs.gate.outputs.actor }}:

            ---
            ${{ needs.gate.outputs.request }}
            ---

            Text after `/claude review` is an optional focus. Honor it but still report anything serious outside it.
            The PR head is checked out. Use `gh pr view ${{ needs.gate.outputs.pr }}` and `gh pr diff ${{ needs.gate.outputs.pr }}`, read surrounding code as needed.

            Steps:
            1. Read CLAUDE.md and CONTRIBUTING.md.
            2. Read the PR title, description and diff.
            3. Check existing comments so you don't repeat them: `gh api repos/${{ github.repository }}/pulls/${{ needs.gate.outputs.pr }}/comments` and `gh pr view ${{ needs.gate.outputs.pr }} --comments`. Skip findings already covered by a comment that still applies.
            4. Verify each candidate finding against the code. Drop anything you can't confirm.
            5. Post one inline comment per confirmed finding with `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`). Say what's wrong, why, and the fix. Add a committable suggestion only if it alone fully fixes the issue.
            6. Replace the body of the in-progress comment with the summary: `gh api -X PATCH repos/${{ github.repository }}/issues/comments/${{ steps.start.outputs.comment }} -f body=...`. Edit only that comment. Never post a new comment or edit any other. Format:

               ## Claude review
               <one line verdict>
               - <finding, file:line> per inline comment posted this run
               Checked: <one line>. Model: claude-opus-5-5.

               No findings: "No issues found." plus what was checked.

            Flag only issues introduced by this PR:
            - Bugs: wrong logic, crashes, nil/undefined access, races, leaks (timers, connections, processes, handles), bad Go error handling, edge cases that will clearly be hit.
            - Security: command injection, path traversal, unsafe file permissions, secrets in code.
            - Project rules: gofmt -s clean, golangci-lint clean, CGO stays disabled, non-critical errors degrade gracefully instead of aborting; gopsutil collectors keep one metric per file; API handlers in api/ wrap gops collectors, no logic duplicated between CLI and API.
            - Go: unformatted code, go.mod/go.sum out of sync with imports, tests that no longer compile.

            Don't flag style or naming, pre-existing issues, anything a linter or compiler catches, speculative input-dependent problems, missing tests or docs, or refactor ideas. Not sure it's real: don't post it.

            Review only. Never edit files, commit, push, approve or request changes. Post each finding once. Keep comments short.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,LS,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api -X PATCH repos/${{ github.repository }}/issues/comments/${{ steps.start.outputs.comment }}:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ needs.gate.outputs.pr }}/comments:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"

      - name: Require a summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ steps.start.outputs.comment }}" --jq .body | grep -q '^## Claude review'

      - name: Drop the comment of a superseded run
        if: cancelled() && steps.start.outputs.comment != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${{ steps.start.outputs.comment }}"

      - if: failure() && steps.start.outputs.comment != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${{ steps.start.outputs.comment }}" \
            -f body="Claude review failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
